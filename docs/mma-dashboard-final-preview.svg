<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="workspaceHead" x1="0" x2="1">
      <stop offset="0" stop-color="#321a20"/>
      <stop offset="0.52" stop-color="#111720"/>
      <stop offset="1" stop-color="#111720"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb}.muted{fill:#8e9aaa}.white{fill:#f8fafc}.red{fill:#e34d4d}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px}.h1{font-size:41px;font-weight:800;letter-spacing:-1.8px}.h2{font-size:21px;font-weight:760}.h3{font-size:15px;font-weight:760}.body{font-size:12px}.small{font-size:10px}.tiny{font-size:9px}.bold{font-weight:750}.line{stroke:#2a3543;stroke-width:1}.input{fill:#0d1219;stroke:#334155}.panel{fill:#131922;stroke:#2a3543}.raised{fill:#19212c;stroke:#2a3543}.soft{fill:#0f141c;stroke:#2a3543}.link{fill:#111821;stroke:#2a3543}.active{fill:#e34d4d;stroke:#e34d4d}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

