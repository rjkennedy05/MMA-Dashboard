        <rect class="link" x="0" y="104" rx="7" width="232" height="48"/>
        <text class="t white small bold" x="12" y="124">Daniel Rodriguez</text><text class="t muted tiny" x="12" y="140">FanDuel</text><text class="t white h3" x="186" y="133">+115</text>

