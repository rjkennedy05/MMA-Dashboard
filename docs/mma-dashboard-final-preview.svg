          <rect class="input" x="48" y="0" rx="6" width="40" height="35"/><text class="muted" x="65" y="23">2</text>
          <rect class="active" x="96" y="0" rx="6" width="40" height="35"/><text class="white" x="113" y="23">3</text>
          <rect class="input" x="144" y="0" rx="6" width="40" height="35"/><text class="muted" x="161" y="23">4</text>
          <rect class="input" x="192" y="0" rx="6" width="40" height="35"/><text class="muted" x="209" y="23">5</text>
