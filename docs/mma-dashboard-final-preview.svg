          <text x="13" y="169">Grappling</text><text class="white bold" x="508" y="169">2</text><text class="white bold" x="607" y="169">3</text>
          <text x="13" y="202">Cardio</text><text class="white bold" x="508" y="202">3</text><text class="white bold" x="607" y="202">4</text>
          <text x="13" y="235">Durability</text><text class="white bold" x="508" y="235">3</text><text class="white bold" x="607" y="235">4</text>
          <text x="13" y="258">Experience</text><text class="white bold" x="508" y="258">3</text><text class="white bold" x="607" y="258">5</text>
        </g>
        <g stroke="#2a3543"><line x1="0" x2="657" y1="82" y2="82"/><line x1="0" x2="657" y1="115" y2="115"/><line x1="0" x2="657" y1="148" y2="148"/><line x1="0" x2="657" y1="181" y2="181"/><line x1="0" x2="657" y1="214" y2="214"/><line x1="0" x2="657" y1="247" y2="247"/></g>

