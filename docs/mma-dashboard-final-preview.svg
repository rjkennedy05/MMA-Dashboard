        <text class="t muted tiny bold" x="335" y="492">RODRIGUEZ: PATH TO WIN</text>
        <rect class="input" x="0" y="502" rx="7" width="322" height="66"/>
        <rect class="input" x="335" y="502" rx="7" width="322" height="66"/>
