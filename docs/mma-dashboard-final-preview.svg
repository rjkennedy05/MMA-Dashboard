        <text class="white body bold" x="13" y="124">Fighter Five</text><text class="white body bold" x="225" y="124">+105</text>
        <text class="white body bold" x="13" y="143">Fighter Six</text><text class="white body bold" x="224" y="143">-125</text>
        <rect class="soft" x="0" y="164" rx="9" width="264" height="73"/>
