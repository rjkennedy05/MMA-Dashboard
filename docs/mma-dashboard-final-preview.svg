      <text class="t muted" x="170" y="25">UFC</text>
      <text class="t muted" x="306" y="25">PFL</text>
      <text class="t muted" x="439" y="25">ONE</text>
      <text class="t muted" x="569" y="25">BKFC</text>
      <text class="t muted" x="710" y="25">DWCS</text>
      <text class="t muted" x="855" y="25">LFA</text>
