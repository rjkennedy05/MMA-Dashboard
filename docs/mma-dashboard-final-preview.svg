        <text class="white body bold" x="13" y="206">Fighter Seven</text><text class="white body bold" x="224" y="206">-210</text>
        <text class="white body bold" x="13" y="225">Fighter Eight</text><text class="white body bold" x="225" y="225">+175</text>
        <rect class="soft" x="0" y="246" rx="9" width="264" height="73"/>
